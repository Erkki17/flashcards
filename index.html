// Get user ID — first from cached _session, then directly from Supabase client
async function getUserId() {
  if (_session?.user?.id) return _session.user.id;
  const { data: { session } } = await sb.auth.getSession();
  _session = session;
  return session?.user?.id ?? null;
}

// Supabase DB helpers (fire-and-forget — components don't need to await)
async function dbSaveCard(card) {
  const uid = await getUserId();
  if (!uid) return;
  const { error } = await sb.from('cards').upsert({
    id: String(card.id), user_id: uid,
    front: card.front, back: card.back,
    interval: card.interval, repetitions: card.repetitions,
    ease_factor: card.easeFactor, next_review: card.nextReview,
  });
  if (error) console.error('dbSaveCard:', error.message);
}

async function dbDeleteCard(id) {
  const uid = await getUserId();
  if (!uid) return;
  const { error } = await sb.from('cards').delete()
    .eq('id', String(id)).eq('user_id', uid);
  if (error) console.error('dbDeleteCard:', error.message);
}

async function dbLoadCards() {
  const { data, error } = await sb.from('cards').select('*').order('created_at');
  if (error) { console.error('dbLoadCards:', error.message); return { cards: null, errorMsg: error.message }; }
  return { cards: data.map(r => ({
    id: r.id, front: r.front, back: r.back,
    interval: r.interval, repetitions: r.repetitions,
    easeFactor: r.ease_factor, nextReview: r.next_review,
  })), errorMsg: null };
}

async function dbRecordStudy(wasCorrect) {
  const uid = await getUserId();
  if (!uid) return;
  const today = new Date().toISOString().slice(0, 10);
  const { data } = await sb.from('study_history').select('*')
    .eq('user_id', uid).eq('date', today).maybeSingle();
  if (data) {
    await sb.from('study_history').update({
      reviewed: data.reviewed + 1,
      correct: data.correct + (wasCorrect ? 1 : 0),
    }).eq('id', data.id);
  } else {
    await sb.from('study_history').insert({
      user_id: uid, date: today,
      reviewed: 1, correct: wasCorrect ? 1 : 0,
    });
  }
}

async function dbLoadHistory() {
  const uid = await getUserId();
  if (!uid) return null;
  const { data, error } = await sb.from('study_history').select('*').eq('user_id', uid);
  if (error) return null;
  const h = {};
  data.forEach(r => { h[r.date] = { reviewed: r.reviewed, correct: r.correct }; });
  return h;
}

// ── Core helpers ──────────────────────────────────────────────────────────────

function newCard(front, back) {
  return {
    id: crypto.randomUUID(),
    front, back,
    interval: 0, repetitions: 0, easeFactor: 2.5,
    nextReview: Date.now(),
  };
}

function sm2(card, quality) {
  let { interval, repetitions, easeFactor } = card;
  const q = quality;
  if (q < 3) { repetitions = 0; interval = 1; }
  else {
    repetitions += 1;
    if      (repetitions === 1) interval = 1;
    else if (repetitions === 2) interval = 6;
    else interval = Math.round(interval * easeFactor);
  }
  easeFactor = Math.max(1.3, easeFactor + 0.1 - (5 - q) * (0.08 + (5 - q) * 0.02));
  return { ...card, interval, repetitions, easeFactor, nextReview: Date.now() + interval * 86400000 };
}

function isDue(card)     { return card.nextReview <= Date.now(); }
function parseBack(text) {
  const sep = text.indexOf(' — ');
  if (sep === -1) return { main: text, hint: null };
  return { main: text.slice(0, sep), hint: text.slice(sep + 3) };
}
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ── localStorage helpers ──────────────────────────────────────────────────────

const OLD_VERB_FRONTS = new Set([
  'send','choose','write','take','give','find','think',
  'buy','sell','hold','rise','fall','make','become','begin',
]);
function migrateVerbCards(cards) {
  return cards.map(card => {
    if (!OLD_VERB_FRONTS.has(card.front.toLowerCase())) return card;
    const match = card.back.match(/^(.+?) — (.+)$/);
    if (!match) return card;
    return { ...card, front: `${card.front} — ${match[1]}`, back: match[2] };
  });
}
function loadCards() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    let cards = JSON.parse(raw);
    if (!localStorage.getItem(MIGRATE_KEY)) {
      cards = migrateVerbCards(cards);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(cards));
      localStorage.setItem(MIGRATE_KEY, '1');
    }
    return cards;
  } catch { return null; }
}
function saveCards(cards) { localStorage.setItem(STORAGE_KEY, JSON.stringify(cards)); }
function loadDirection()  { return localStorage.getItem(DIRECTION_KEY) || 'en-fi'; }
function saveDirection(d) { localStorage.setItem(DIRECTION_KEY, d); }
function loadHistory() {
  try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || '{}'); } catch { return {}; }
}
function recordStudy(wasCorrect) {
  const key = new Date().toISOString().slice(0, 10);
  const h = loadHistory();
  const d = h[key] || { reviewed: 0, correct: 0 };
  d.reviewed += 1;
  if (wasCorrect) d.correct += 1;
  h[key] = d;
  localStorage.setItem(HISTORY_KEY, JSON.stringify(h));
  dbRecordStudy(wasCorrect); // async cloud sync
}
function getStreak(history) {
  const today = new Date();
  const todayKey = today.toISOString().slice(0, 10);
  const start = (history[todayKey]?.reviewed > 0) ? 0 : 1;
  let streak = 0;
  for (let i = start; i < 365; i++) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    const k = d.toISOString().slice(0, 10);
    if (history[k]?.reviewed > 0) streak++;
    else break;
  }
  return streak;
}

  const [queue]                   = useState(() => cards.filter(isDue));
  const [idx,       setIdx]       = useState(0);
  const [phase,     setPhase]     = useState('question');
  const [typed,     setTyped]     = useState('');
  const [correct,   setCorrect]   = useState(null);
  const [hintShown, setHintShown] = useState(false);
  const [done,      setDone]      = useState(false);
  const inputRef = useRef(null);

  useEffect(() => {
    setPhase('question'); setTyped(''); setCorrect(null); setHintShown(false);
  }, [direction]);

  useEffect(() => {
    if (direction === 'fi-en' && phase === 'question') inputRef.current?.focus();
  }, [idx, phase, direction]);

  useEffect(() => {
    function onKey(e) {
      const tag = document.activeElement?.tagName;
      const inInput = tag === 'BUTTON' || tag === 'INPUT' || tag === 'TEXTAREA';
      if (e.key === 'Enter' && direction === 'en-fi' && !inInput) {
        setPhase(p => p === 'question' ? 'answered' : 'question');
        return;
      }
      if (phase === 'answered') {
        if      (e.key === 'ArrowLeft')  { e.preventDefault(); rate(1); }
        else if (e.key === 'ArrowDown')  { e.preventDefault(); rate(0); }
        else if (e.key === 'ArrowRight') { e.preventDefault(); rate(3); }
      }
    }
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [direction, phase]);

  if (queue.length === 0 || done) return (
    <div className="max-w-3xl mx-auto px-4 py-16 text-center">
      <div className="text-5xl mb-4">🎉</div>
      <h2 className="text-2xl font-bold text-amber-400 mb-2">Kaikki kertailtu!</h2>
      <p className="text-gray-400">Ei enempää erääntyneitä kortteja.</p>
    </div>
  );

  const card         = queue[idx];
  const isFiEn       = direction === 'fi-en';
  const promptText   = isFiEn ? card.back  : card.front;
  const answerText   = isFiEn ? card.front : card.back;
  const parsedPrompt = parseBack(promptText);
  const parsedAnswer = parseBack(answerText);

  function advance() {
    if (idx + 1 >= queue.length) setDone(true);
    else {
      setIdx(i => i + 1); setPhase('question');
      setTyped(''); setCorrect(null); setHintShown(false);
    }
  }

  function rate(quality) {
    recordStudy(quality >= 3);
    const updated  = sm2(card, quality);
    const newCards = cards.map(c => c.id === updated.id ? updated : c);
    setCards(newCards); saveCards(newCards);
    dbSaveCard(updated);
    advance();
  }

  function checkAnswer(e) {
    e.preventDefault();
    if (!typed.trim()) return;
    const userInput   = typed.trim().toLowerCase();
    const fullAnswer  = card.front.trim().toLowerCase();
    const shortAnswer = fullAnswer.split(' — ')[0].trim();
    setCorrect(userInput === fullAnswer || userInput === shortAnswer);
    setPhase('answered');
  }

  return (
    <div className="max-w-3xl mx-auto px-4 py-8">
      <div className="flex items-center justify-between mb-4">
        <span className="text-gray-400 text-sm">Kortti {idx + 1} / {queue.length}</span>
        <DirectionToggle direction={direction} setDirection={setDirection} />
      </div>
      <div className="w-full bg-gray-800 rounded-full h-1.5 mb-8">
        <div className="bg-amber-500 h-1.5 rounded-full transition-all"
          style={{ width: `${(idx / queue.length) * 100}%` }} />
      </div>

      {isFiEn ? (
        <>
          <div className="bg-gray-800 rounded-2xl p-8 mb-6 border border-gray-700 min-h-[150px] flex flex-col items-center justify-center gap-3">
            <p className="text-xl text-amber-200 text-center leading-relaxed">{parsedPrompt.main}</p>
            {parsedPrompt.hint && (hintShown
              ? <p className="text-gray-400 text-sm text-center italic">{parsedPrompt.hint}</p>
              : <button onClick={() => setHintShown(true)}
                  className="text-gray-500 text-xs border border-gray-700 hover:border-amber-500/50 hover:text-amber-400 rounded-lg px-3 py-1.5 transition-colors">
                  💡 Näytä vinkki
                </button>
            )}
          </div>
          {phase === 'question' ? (
            <form onSubmit={checkAnswer} className="space-y-3">
              <input ref={inputRef} value={typed} onChange={e => setTyped(e.target.value)}
                className="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-white text-lg focus:outline-none focus:border-amber-500 transition-colors"
                placeholder="Kirjoita englanninkielinen vastaus…" autoComplete="off" spellCheck="false" />
              <button type="submit" disabled={!typed.trim()}
                className="w-full py-3 bg-amber-500 hover:bg-amber-400 disabled:bg-gray-700 disabled:text-gray-500 text-gray-900 font-bold rounded-xl transition-colors">
                Tarkista
              </button>
            </form>
          ) : (
            <div className="space-y-4">
              {correct ? (
                <div className="bg-green-500/10 border border-green-500/40 rounded-xl px-5 py-4 text-green-400 text-center">
                  <span className="font-semibold text-green-300">✓ Oikein!</span>
                  <span className="ml-2">„{typed}"</span>
                </div>
              ) : (
                <div className="space-y-2">
                  <div className="bg-red-500/10 border border-red-500/40 rounded-xl px-5 py-4 text-red-400 text-center">
                    <span className="font-semibold text-red-300">✗ Väärin</span>
                    <span className="ml-2">— kirjoitit: „{typed}"</span>
                  </div>
                  <div className="bg-gray-800 border border-gray-700 rounded-xl px-5 py-3 text-center">
                    <span className="text-gray-400 text-sm">Oikea vastaus: </span>
                    <span className="text-white font-semibold">{answerText}</span>
                  </div>
                </div>
              )}
              <RatingButtons onRate={rate} />
            </div>
          )}
        </>
      ) : (
        <>
          <div className="flip-card w-full mb-8" style={{ minHeight: 200 }}>
            <div className={`flip-inner w-full h-full relative ${phase === 'answered' ? 'flipped' : ''}`} style={{ minHeight: 200 }}>
              <div className="flip-front absolute inset-0 bg-gray-800 rounded-2xl flex flex-col items-center justify-center p-8 cursor-pointer border border-gray-700 hover:border-amber-500/50 transition-colors"
                onClick={() => setPhase('answered')}>
                <p className="text-2xl font-semibold text-white text-center">{parsedPrompt.main}</p>
                {phase === 'question' && <p className="text-gray-500 text-sm mt-4">Klikkaa tai paina Enter kääntääksesi</p>}
              </div>
              <div className="flip-back absolute inset-0 bg-gray-800 rounded-2xl flex flex-col items-center justify-center gap-3 p-8 border border-amber-500/30 cursor-pointer hover:border-amber-400/50 transition-colors"
                onClick={() => setPhase('question')} title="Klikkaa tai paina Enter kääntääksesi takaisin">
                <p className="text-xl text-amber-200 text-center leading-relaxed">{parsedAnswer.main}</p>
                {parsedAnswer.hint && (hintShown
                  ? <p className="text-gray-400 text-sm text-center italic">{parsedAnswer.hint}</p>
                  : <button onClick={e => { e.stopPropagation(); setHintShown(true); }}
                      className="text-gray-500 text-xs border border-gray-700 hover:border-amber-500/50 hover:text-amber-400 rounded-lg px-3 py-1.5 transition-colors">
                      💡 Näytä vinkki
                    </button>
                )}
                <p className="text-gray-600 text-xs mt-1">↩ klikkaa tai Enter palataksesi</p>
              </div>
            </div>
          </div>
          {phase === 'question' ? (
            <button onClick={() => setPhase('answered')}
              className="w-full py-3 bg-gray-700 hover:bg-gray-600 text-white rounded-xl transition-colors flex items-center justify-center gap-2">
              Näytä vastaus
              <span className="text-gray-500 text-xs border border-gray-600 rounded px-1.5 py-0.5">Enter</span>
            </button>
          ) : (
            <RatingButtons onRate={rate} />
          )}
        </>
      )}
    </div>
  );
}

// ── Add / Edit ────────────────────────────────────────────────────────────────

function AddCardView({ cards, setCards, editCard, setEditCard }) {
  const [front, setFront] = useState(editCard ? editCard.front : '');
  const [back,  setBack]  = useState(editCard ? editCard.back  : '');
  const [saved, setSaved] = useState(false);

  function handleSubmit(e) {
    e.preventDefault();
    if (!front.trim() || !back.trim()) return;
    let updated, cardToSync;
    if (editCard) {
      const edited = { ...editCard, front: front.trim(), back: back.trim() };
      updated = cards.map(c => c.id === editCard.id ? edited : c);
      cardToSync = edited;
      setEditCard(null);
    } else {
      const card = newCard(front.trim(), back.trim());
      updated = [...cards, card];
      cardToSync = card;
    }
    setCards(updated); saveCards(updated);
    dbSaveCard(cardToSync);
    setFront(''); setBack('');
    setSaved(true); setTimeout(() => setSaved(false), 2000);
  }

  return (
    <div className="max-w-3xl mx-auto px-4 py-8">
      <h2 className="text-xl font-bold text-amber-400 mb-6">
        {editCard ? 'Muokkaa korttia' : 'Lisää kortti'}
      </h2>
      <form onSubmit={handleSubmit} className="space-y-4">
        <div>
          <label className="block text-gray-400 text-sm mb-1">Etupuoli</label>
          <input value={front} onChange={e => setFront(e.target.value)}
            className="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-amber-500"
            placeholder="Sana tai kysymys" />
        </div>
        <div>
          <label className="block text-gray-400 text-sm mb-1">Takapuoli</label>
          <textarea value={back} onChange={e => setBack(e.target.value)} rows={3}
            className="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-amber-500 resize-none"
            placeholder="Vastaus tai käännös" />
        </div>
        <div className="flex gap-3">
          <button type="submit"
            className="flex-1 py-3 bg-amber-500 hover:bg-amber-400 text-gray-900 font-bold rounded-xl transition-colors">
            {editCard ? 'Tallenna muutokset' : 'Lisää kortti'}
          </button>
          {editCard && (
            <button type="button" onClick={() => setEditCard(null)}
              className="px-6 py-3 bg-gray-700 hover:bg-gray-600 text-white rounded-xl transition-colors">
              Peruuta
            </button>
          )}
        </div>
        {saved && <div className="text-green-400 text-sm text-center">Kortti tallennettu!</div>}
      </form>
    </div>
  );
}

// ── Import ────────────────────────────────────────────────────────────────────

function ImportView({ cards, setCards }) {
  const [text,  setText]  = useState('');
  const [msg,   setMsg]   = useState('');
  const [error, setError] = useState('');

  function handleImport() {
    setMsg(''); setError('');
    try {
      const parsed = JSON.parse(text.trim());
      if (!Array.isArray(parsed)) throw new Error('Pitää olla JSON-taulukko');
      const existing = new Set(cards.map(c => c.front.toLowerCase()));
      const toAdd = parsed
        .filter(item => item.front && item.back && !existing.has(item.front.toLowerCase()))
        .map(item => newCard(String(item.front).trim(), String(item.back).trim()));
      if (toAdd.length === 0) { setMsg('Ei uusia kortteja tuotavaksi (kaikki jo olemassa).'); return; }
      const updated = [...cards, ...toAdd];
      setCards(updated); saveCards(updated);
      toAdd.forEach(c => dbSaveCard(c));
      setText('');
      setMsg(`Tuotiin ${toAdd.length} uutta korttia`);
    } catch (e) { setError('Virheellinen JSON: ' + e.message); }
  }

  return (
    <div className="max-w-3xl mx-auto px-4 py-8">
      <h2 className="text-xl font-bold text-amber-400 mb-2">Tuo kortit</h2>
      <p className="text-gray-400 text-sm mb-6">
        Liitä JSON-taulukko muodossa:{' '}
        <code className="text-amber-300">[{"{"}"front":"...", "back":"..."{"}"}]</code>
      </p>
      <textarea value={text} onChange={e => setText(e.target.value)} rows={10}
        className="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-amber-500 resize-none font-mono text-sm mb-4"
        placeholder={'[\n  {"front": "hello", "back": "hei"},\n  {"front": "world", "back": "maailma"}\n]'} />
      <button onClick={handleImport} disabled={!text.trim()}
        className="w-full py-3 bg-amber-500 hover:bg-amber-400 disabled:bg-gray-700 disabled:text-gray-500 text-gray-900 font-bold rounded-xl transition-colors">
        Tuo kortit
      </button>
      {msg   && <div className="mt-4 text-green-400 text-center font-medium">{msg}</div>}
      {error && <div className="mt-4 text-red-400 text-center text-sm">{error}</div>}
    </div>
  );
}

function ManageView({ cards, setCards, setEditCard, setView }) {
  const [search, setSearch] = useState('');
  const filtered = cards.filter(
    c => c.front.toLowerCase().includes(search.toLowerCase()) ||
         c.back.toLowerCase().includes(search.toLowerCase())
  );

  function deleteCard(id) {
    if (!confirm('Poistetaanko kortti?')) return;
    const updated = cards.filter(c => c.id !== id);
    setCards(updated); saveCards(updated);
    dbDeleteCard(id);
  }

  function statusLabel(card) {
    if (card.repetitions === 0) return { label: 'Uusi',      cls: 'text-blue-400' };
    if (card.repetitions >= 3)  return { label: 'Hallittu',  cls: 'text-green-400' };
    return                             { label: 'Oppiminen', cls: 'text-amber-400' };
  }

  return (
    <div className="max-w-3xl mx-auto px-4 py-8">
      <h2 className="text-xl font-bold text-amber-400 mb-4">Kortit ({cards.length})</h2>
      <input value={search} onChange={e => setSearch(e.target.value)}
        className="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-amber-500 mb-4"
        placeholder="Hae kortteja…" />
      <div className="space-y-2">
        {filtered.map(card => {
          const { label, cls } = statusLabel(card);
          return (
            <div key={card.id} className="bg-gray-800 rounded-xl px-4 py-3 flex items-center gap-3 border border-gray-700">
              <div className="flex-1 min-w-0">
                <p className="text-white font-medium truncate">{card.front}</p>
                <p className="text-gray-400 text-sm truncate">{card.back}</p>
              </div>
              <span className={`text-xs font-medium ${cls} shrink-0`}>{label}</span>
              <button onClick={() => { setEditCard(card); setView('add'); }}
                className="text-gray-400 hover:text-amber-400 transition-colors p-1 shrink-0" title="Muokkaa">✏️</button>
              <button onClick={() => deleteCard(card.id)}
                className="text-gray-400 hover:text-red-400 transition-colors p-1 shrink-0" title="Poista">🗑️</button>
            </div>
          );
        })}
        {filtered.length === 0 && <p className="text-gray-500 text-center py-8">Ei kortteja.</p>}
      </div>
    </div>
  );
}

// ── Heatmap ───────────────────────────────────────────────────────────────────

function Heatmap({ history }) {
  const days = [];
  const today = new Date();
  for (let i = 29; i >= 0; i--) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    const key  = d.toISOString().slice(0, 10);
    const data = history[key] || { reviewed: 0, correct: 0 };
    days.push({ key, day: d.getDate(), month: d.getMonth() + 1, ...data });
  }
  function cellColor(n) {
    if (n === 0) return 'bg-gray-700/60 border border-gray-700';
    if (n < 5)   return 'bg-amber-900/80';
    if (n < 15)  return 'bg-amber-600';
    return 'bg-amber-400';
  }
  return (
    <div>
      <div className="grid gap-1.5" style={{ gridTemplateColumns: 'repeat(10, 1fr)' }}>
        {days.map(d => (
          <div key={d.key} className={`${cellColor(d.reviewed)} rounded aspect-square`}
            title={`${d.day}.${d.month}.: ${d.reviewed} korttia${d.reviewed > 0 ? ` · ${Math.round(d.correct / d.reviewed * 100)}% oikein` : ''}`} />
        ))}
      </div>
      <div className="flex items-center gap-1.5 mt-3 text-xs text-gray-600">
        <span>Vähemmän</span>
        {['bg-gray-700/60 border border-gray-700','bg-amber-900/80','bg-amber-600','bg-amber-400'].map((c,i) => (
          <div key={i} className={`w-3 h-3 rounded ${c}`} />
        ))}
        <span>Enemmän</span>
      </div>
    </div>
  );
}

// ── Grammar ───────────────────────────────────────────────────────────────────

function DrillSession({ drillType, onRestart }) {
  const [exercises]               = useState(() => shuffle(GRAMMAR_DRILLS[drillType]));
  const [idx,    setIdx]          = useState(0);
  const [phase,  setPhase]        = useState('question');
  const [score,  setScore]        = useState({ correct: 0, total: 0 });
  const [done,   setDone]         = useState(false);
  const [ps,     setPs]           = useState('');
  const [pp,     setPp]           = useState('');
  const [inp,    setInp]          = useState('');
  const [result, setResult]       = useState(null);
  const nextRef  = useRef(null);
  const firstRef = useRef(null);

  const ex = exercises[idx];

  useEffect(() => {
    if (phase === 'question') firstRef.current?.focus();
    else nextRef.current?.focus();
  }, [idx, phase]);

  function advance() {
    if (idx + 1 >= exercises.length) { setDone(true); return; }
    setIdx(i => i + 1); setPhase('question');
    setPs(''); setPp(''); setInp(''); setResult(null);
  }
  function submit(correct, extra = {}) {
    setResult({ correct, ...extra });
    setScore(s => ({ correct: s.correct + (correct ? 1 : 0), total: s.total + 1 }));
    setPhase('answered');
  }
  const checkVerb = e => { e.preventDefault();
    const psOk = ps.trim().toLowerCase() === ex.pastSimple.toLowerCase();
    const ppOk = pp.trim().toLowerCase() === ex.pastParticiple.toLowerCase();
    submit(psOk && ppOk, { psOk, ppOk }); };
  const checkPrep = e => { e.preventDefault();
    submit(inp.trim().toLowerCase() === ex.answer.toLowerCase()); };
  const pickAgreement = opt =>
    submit(opt.toLowerCase() === ex.answer.toLowerCase(), { selected: opt });

  function SentenceBlank({ fill, fillClass }) {
    const parts = ex.sentence.split('___');
    return (
      <p className="text-xl text-white leading-relaxed text-center">
        {parts[0]}
        {fill
          ? <span className={`font-bold mx-1 ${fillClass}`}>{fill}</span>
          : <span className="inline-block border-b-2 border-amber-500 w-14 mx-1 align-bottom" />}
        {parts[1]}
      </p>
    );
  }

  if (done) {
    const pct = Math.round(score.correct / exercises.length * 100);
    return (
      <div className="text-center py-10">
        <div className="text-5xl mb-4">{pct === 100 ? '🎉' : pct >= 70 ? '👍' : '📝'}</div>
        <h3 className="text-2xl font-bold text-amber-400 mb-1">{score.correct} / {exercises.length} oikein</h3>
        <p className="text-gray-400 mb-8">{pct}% oikein</p>
        <button onClick={onRestart} className="px-8 py-3 bg-amber-500 hover:bg-amber-400 text-gray-900 font-bold rounded-xl transition-colors">
          Aloita uudelleen
        </button>
      </div>
    );
  }

  const Question = () => {
    if (drillType === 'verbs') return (
      <form onSubmit={checkVerb} className="space-y-4">
        <div className="bg-gray-800 rounded-2xl p-8 border border-gray-700 text-center">
          <p className="text-gray-500 text-xs uppercase tracking-wider mb-2">Infinitive</p>
          <p className="text-4xl font-bold text-white">{ex.infinitive}</p>
        </div>
        <div className="grid grid-cols-2 gap-3">
          {[
            { label: 'Past Simple',     val: ps, set: setPs, ref: firstRef, ph: 'e.g. went' },
            { label: 'Past Participle', val: pp, set: setPp, ref: null,     ph: 'e.g. gone' },
          ].map(({ label, val, set, ref, ph }) => (
            <div key={label}>
              <label className="text-gray-400 text-xs mb-1.5 block">{label}</label>
              <input ref={ref} value={val} onChange={e => set(e.target.value)}
                className="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-amber-500"
                placeholder={ph} autoComplete="off" spellCheck="false" />
            </div>
          ))}
        </div>
        <button type="submit" disabled={!ps.trim() || !pp.trim()}
          className="w-full py-3 bg-amber-500 hover:bg-amber-400 disabled:bg-gray-700 disabled:text-gray-500 text-gray-900 font-bold rounded-xl transition-colors">
          Tarkista
        </button>
      </form>
    );
    if (drillType === 'prepositions') return (
      <form onSubmit={checkPrep} className="space-y-4">
        <div className="bg-gray-800 rounded-2xl p-8 border border-gray-700">
          <p className="text-gray-500 text-xs uppercase tracking-wider mb-4 text-center">Täydennä prepositio</p>
          <SentenceBlank />
        </div>
        <input ref={firstRef} value={inp} onChange={e => setInp(e.target.value)}
          className="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-white text-lg focus:outline-none focus:border-amber-500"
          placeholder="Kirjoita prepositio…" autoComplete="off" spellCheck="false" />
        <button type="submit" disabled={!inp.trim()}
          className="w-full py-3 bg-amber-500 hover:bg-amber-400 disabled:bg-gray-700 disabled:text-gray-500 text-gray-900 font-bold rounded-xl transition-colors">
          Tarkista
        </button>
      </form>
    );
    return (
      <div className="space-y-6">
        <div className="bg-gray-800 rounded-2xl p-8 border border-gray-700">
          <p className="text-gray-500 text-xs uppercase tracking-wider mb-4 text-center">Valitse oikea muoto</p>
          <SentenceBlank />
        </div>
        <div className="grid grid-cols-2 gap-4">
          {ex.options.map((opt, i) => (
            <button key={opt} ref={i === 0 ? firstRef : null} onClick={() => pickAgreement(opt)}
              className="py-5 bg-gray-700 hover:bg-gray-600 text-white text-xl font-semibold rounded-xl transition-colors">
              {opt}
            </button>
          ))}
        </div>
      </div>
    );
  };

  const Answered = () => {
    const ok = result?.correct;
    const banner = (
      <div className={`rounded-xl px-5 py-3 border text-center font-semibold ${ok ? 'bg-green-500/10 border-green-500/30 text-green-300' : 'bg-red-500/10 border-red-500/30 text-red-300'}`}>
        {ok ? '✓ Oikein!' : '✗ Väärin'}
      </div>
    );
    const nextBtn = (
      <button ref={nextRef} onClick={advance}
        className="w-full py-3 bg-gray-700 hover:bg-gray-600 text-white font-semibold rounded-xl transition-colors">
        {idx + 1 < exercises.length ? 'Seuraava →' : 'Näytä tulos'}
      </button>
    );
    if (drillType === 'verbs') return (
      <div className="space-y-3">
        <div className="bg-gray-800 rounded-2xl p-6 border border-gray-700 text-center">
          <p className="text-gray-500 text-xs uppercase tracking-wider mb-1">Infinitive</p>
          <p className="text-3xl font-bold text-white">{ex.infinitive}</p>
        </div>
        {banner}
        <div className="grid grid-cols-2 gap-3">
          {[
            { label: 'Past Simple',     yours: ps, ans: ex.pastSimple,     ok: result.psOk },
            { label: 'Past Participle', yours: pp, ans: ex.pastParticiple, ok: result.ppOk },
          ].map(({ label, yours, ans, ok }) => (
            <div key={label} className={`rounded-xl p-4 border ${ok ? 'border-green-500/30 bg-green-500/5' : 'border-red-500/30 bg-red-500/5'}`}>
              <p className="text-gray-500 text-xs mb-1">{label}</p>
              <p className={`font-semibold ${ok ? 'text-green-400' : 'text-red-400'}`}>{yours || '—'}</p>
              {!ok && <p className="text-white text-sm mt-1">→ <span className="font-bold">{ans}</span></p>}
            </div>
          ))}
        </div>
        {nextBtn}
      </div>
    );
    if (drillType === 'prepositions') return (
      <div className="space-y-3">
        <div className="bg-gray-800 rounded-2xl p-8 border border-gray-700">
          <SentenceBlank fill={inp || '—'} fillClass={ok ? 'text-green-400' : 'text-red-400'} />
          {!ok && <p className="text-gray-400 text-sm mt-3 text-center">Oikea: <span className="text-white font-bold">{ex.answer}</span></p>}
        </div>
        {banner}{nextBtn}
      </div>
    );
    return (
      <div className="space-y-3">
        <div className="bg-gray-800 rounded-2xl p-8 border border-gray-700">
          <SentenceBlank fill={result.selected} fillClass={ok ? 'text-green-400' : 'text-red-400'} />
          {!ok && <p className="text-gray-400 text-sm mt-3 text-center">Oikea: <span className="text-white font-bold">{ex.answer}</span></p>}
        </div>
        {banner}{nextBtn}
      </div>
    );
  };

  return (
    <div>
      <div className="flex items-center justify-between mb-3">
        <span className="text-gray-400 text-sm">Tehtävä {idx + 1} / {exercises.length}</span>
        <span className="text-amber-400 text-sm font-medium">{score.correct} oikein</span>
      </div>
      <div className="w-full bg-gray-800 rounded-full h-1.5 mb-8">
        <div className="bg-amber-500 h-1.5 rounded-full transition-all" style={{ width: `${(idx / exercises.length) * 100}%` }} />
      </div>
      {phase === 'question' ? <Question /> : <Answered />}
    </div>
  );
}

function GrammarView() {
  const [drillType,   setDrillType]   = useState('verbs');
  const [sessionKey,  setSessionKey]  = useState(0);
  const TABS = [
    { id: 'verbs',        label: 'Epäsäännölliset verbit', desc: 'Past simple & participle' },
    { id: 'prepositions', label: 'Prepositiot',             desc: 'Täydennä prepositio' },
    { id: 'agreement',    label: 'Kongruenssi',             desc: 'Valitse verbin muoto' },
  ];
  return (
    <div className="max-w-3xl mx-auto px-4 py-8">
      <h2 className="text-xl font-bold text-amber-400 mb-6">Kielioppi</h2>
      <div className="grid grid-cols-3 gap-2 mb-8">
        {TABS.map(t => (
          <button key={t.id} onClick={() => { setDrillType(t.id); setSessionKey(k => k + 1); }}
            className={`py-3 px-2 rounded-xl text-sm font-medium transition-colors border ${
              drillType === t.id
                ? 'bg-amber-500 text-gray-900 border-amber-500'
                : 'bg-gray-800 text-gray-400 border-gray-700 hover:border-amber-500/40 hover:text-white'
            }`}>
            <div className="font-semibold">{t.label}</div>
            <div className={`text-xs mt-0.5 ${drillType === t.id ? 'text-amber-900' : 'text-gray-600'}`}>{t.desc}</div>
          </button>
        ))}
      </div>
      <DrillSession key={`${drillType}-${sessionKey}`} drillType={drillType} onRestart={() => setSessionKey(k => k + 1)} />
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────────────────────

function App() {
  const [authState,  setAuthState]  = useState('loading'); // 'loading' | 'anon' | 'auth'
  const [cards,      setCards]      = useState([]);
  const [syncing,    setSyncing]    = useState(false);
  const [syncError,  setSyncError]  = useState(null);
  const [view,       setView]       = useState('home');
  const [editCard,   setEditCard]   = useState(null);
  const [direction,  setDirection]  = useState(loadDirection);

  useEffect(() => {
    sb.auth.getSession().then(({ data: { session } }) => {
      _session = session;
      if (session) { setAuthState('auth'); syncFromSupabase(); }
      else          { setAuthState('anon'); }
    });

    const { data: { subscription } } = sb.auth.onAuthStateChange((event, session) => {
      _session = session;
      if (session) {
        setAuthState('auth');
        if (event === 'SIGNED_IN') syncFromSupabase();
      } else {
        setAuthState('anon');
        setCards([]);
      }
    });
    return () => subscription.unsubscribe();
  }, []);

  async function syncFromSupabase() {
    setSyncing(true);
    setSyncError(null);
    try {
      // Verify session first
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { setSyncError('Ei istuntoa — kirjaudu uudelleen sisään'); return; }
      _session = session;

      const { cards: dbCards, errorMsg } = await dbLoadCards();
      if (dbCards === null) {
        // Network error — fall back to localStorage
        const local = loadCards();
        const fallback = local || PRELOADED.map(p => newCard(p.front, p.back));
        setCards(fallback); saveCards(fallback);
        setSyncError('DB-virhe: ' + errorMsg);
        return;
      }
      if (dbCards.length === 0) {
        // First login — migrate any existing localStorage cards
        const local = loadCards();
        const toUpload = (local && local.length > 0)
          ? local
          : PRELOADED.map(p => newCard(p.front, p.back));
        await Promise.all(toUpload.map(c => dbSaveCard(c)));
        setCards(toUpload); saveCards(toUpload);
      } else {
        setCards(dbCards); saveCards(dbCards);
      }
    } catch(e) {
      setSyncError('Virhe: ' + e.message);
    } finally {
      setSyncing(false);
    }
  }

  const dueCount = cards.filter(isDue).length;

  if (authState === 'loading') return (
    <div className="min-h-screen bg-gray-900 flex items-center justify-center">
      <div className="text-center">
        <div className="text-4xl font-bold text-amber-400 mb-3">Flashcards</div>
        <div className="text-gray-500 text-sm animate-pulse">Ladataan…</div>
      </div>
    </div>
  );

  if (authState === 'anon') return <AuthView />;

  return (
    <div className="min-h-screen bg-gray-900 text-white">
      <NavBar view={view} setView={setView} dueCount={dueCount}
        email={_session?.user?.email} syncing={syncing} onSync={syncFromSupabase} />
      {syncing && (
        <div className="bg-amber-500/10 border-b border-amber-500/20 text-amber-400/80 text-xs text-center py-1.5">
          Synkronoidaan pilven kanssa…
        </div>
      )}
      {syncError && (
        <div className="bg-red-900/40 border-b border-red-500/30 text-red-400 text-xs text-center py-2 flex items-center justify-center gap-3">
          ⚠️ {syncError}
          <button onClick={() => { setSyncError(null); syncFromSupabase(); }}
            className="underline text-red-300 hover:text-red-200">Yritä uudelleen</button>
        </div>
      )}
      <main>
        {view === 'home'    && <HomeView cards={cards} setView={setView} direction={direction} setDirection={setDirection} />}
        {view === 'study'   && <StudyView cards={cards} setCards={setCards} direction={direction} setDirection={setDirection} />}
        {view === 'add'     && <AddCardView cards={cards} setCards={setCards} editCard={editCard} setEditCard={setEditCard} />}
        {view === 'import'  && <ImportView cards={cards} setCards={setCards} />}
        {view === 'manage'  && <ManageView cards={cards} setCards={setCards} setEditCard={setEditCard} setView={setView} />}
        {view === 'stats'   && <StatsView cards={cards} />}
        {view === 'grammar' && <GrammarView />}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
