// Module-level session reference — updated by auth listener
let _session = null;

// REST API helper — uses session token directly, bypasses client session issues
async function apiFetch(path, options = {}) {
  const { data: { session } } = await sb.auth.getSession();
  if (session) _session = session;
  const headers = {
    'apikey': SUPABASE_KEY,
    'Content-Type': 'application/json',
    ...(session ? { 'Authorization': `Bearer ${session.access_token}` } : {}),
    ...(options.headers || {}),
  };
  const res = await fetch(`${SUPABASE_URL}/rest/v1${path}`, { ...options, headers });
  if (res.status === 204 || res.status === 201) return null;
  if (!res.ok) {
    const err = await res.json().catch(() => ({ message: res.statusText }));
    throw new Error(err.message || res.statusText);
  }
  return res.json();
}

async function getUserId() {
  if (_session?.user?.id) return _session.user.id;
  const { data: { session } } = await sb.auth.getSession();
  _session = session;
  return session?.user?.id ?? null;
}

// Supabase DB helpers (fire-and-forget — components don't need to await)
async function dbSaveCard(card) {
  const uid = await getUserId();
  if (!uid) return;
  try {
    await apiFetch('/cards', {
      method: 'POST',
      headers: { 'Prefer': 'resolution=merge-duplicates' },
      body: JSON.stringify({
        id: String(card.id), user_id: uid,
        front: card.front, back: card.back,
        example: card.example || null,
        deck: card.deck || 'yleinen',
        stage: card.stage || 1,
        interval: card.interval, repetitions: card.repetitions,
        ease_factor: card.easeFactor, next_review: card.nextReview,
      }),
    });
  } catch(e) { console.error('dbSaveCard:', e.message); }
}

async function dbDeleteCard(id) {

    await apiFetch(`/cards?id=eq.${encodeURIComponent(String(id))}&user_id=eq.${uid}`, {

async function dbLoadCards() {

    const data = await apiFetch('/cards?select=*&order=created_at');

      id: r.id, front: r.front, back: r.back,

}

async function dbLoadHistory() {
  const uid = await getUserId();

  try {
    const data = await apiFetch(`/study_history?user_id=eq.${uid}&select=*`);
    const h = {};

  } catch(e) { return null; }
}

function newCard(front, back, example=null, deck='yleinen') {
  return {
    id: crypto.randomUUID(),
    front, back, example, deck,
    interval: 0, repetitions: 0, easeFactor: 2.5,
    nextReview: Date.now(),
    stage: 1,
  };
}

// Progressive mode: determine effective direction based on card stage
function getCardDirection(card, direction) {
  if (direction === 'auto') return (card?.stage || 1) >= 2 ? 'fi-en' : 'en-fi';
  return direction;
}

function sm2(card, quality) {
  let { interval, repetitions, easeFactor } = card;
  const q = quality;
  if (q < 3) { repetitions = 0; interval = 1; }
  else {
    repetitions += 1;
    if      (repetitions === 1) interval = 1;
    else if (repetitions === 2) interval = 6;
    else interval = Math.round(interval * easeFactor);
  }
  easeFactor = Math.max(1.3, easeFactor + 0.1 - (5 - q) * (0.08 + (5 - q) * 0.02));
  return { ...card, interval, repetitions, easeFactor, nextReview: Date.now() + interval * 86400000 };
}

function isDue(card)     { return card.nextReview <= Date.now(); }
function parseBack(text) {
  const sep = text.indexOf(' — ');
  if (sep === -1) return { main: text, hint: null };
  return { main: text.slice(0, sep), hint: text.slice(sep + 3) };
}
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const OLD_VERB_FRONTS = new Set([
  'send','choose','write','take','give','find','think',
  'buy','sell','hold','rise','fall','make','become','begin',
]);
function migrateVerbCards(cards) {
  return cards.map(card => {
    if (!OLD_VERB_FRONTS.has(card.front.toLowerCase())) return card;
    const match = card.back.match(/^(.+?) — (.+)$/);
    if (!match) return card;
    return { ...card, front: `${card.front} — ${match[1]}`, back: match[2] };
  });
}
function loadCards() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    let cards = JSON.parse(raw);
    if (!localStorage.getItem(MIGRATE_KEY)) {
      cards = migrateVerbCards(cards);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(cards));
      localStorage.setItem(MIGRATE_KEY, '1');
    }
    // Migrate: add deck field to cards that don't have it
    cards = cards.map(c => c.deck ? c : { ...c, deck: 'yleinen' });
    return cards;
  } catch { return null; }
}
function saveCards(cards) { localStorage.setItem(STORAGE_KEY, JSON.stringify(cards)); }

function recordStudy(wasCorrect) {
  const key = new Date().toISOString().slice(0, 10);
  const h = loadHistory();
  const d = h[key] || { reviewed: 0, correct: 0 };
  d.reviewed += 1;
  if (wasCorrect) d.correct += 1;
  h[key] = d;
  localStorage.setItem(HISTORY_KEY, JSON.stringify(h));
  dbRecordStudy(wasCorrect); // async cloud sync
}
function getStreak(history) {
  const today = new Date();
  const todayKey = today.toISOString().slice(0, 10);
  const start = (history[todayKey]?.reviewed > 0) ? 0 : 1;
  let streak = 0;
  for (let i = start; i < 365; i++) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    const k = d.toISOString().slice(0, 10);
    if (history[k]?.reviewed > 0) streak++;
    else break;
  }
  return streak;
}

}

// Call after each review to update streak state; returns {streakData, goalJustMet, recoveryJustDone, newMilestone}
function updateStreak(todayCount) {
  const today=dateStr(0), yesterday=dateStr(-1), dayBefore=dateStr(-2);
  let s=loadStreak();
  // Validate stale state from previous days
  if (s.lastGoalDate && s.lastGoalDate < dayBefore) {
    if (s.inRecovery) s={...s,current:0,inRecovery:false,baseStreak:0}; // recovery failed
    else if (s.lastGoalDate < dayBefore) s={...s,current:0,inRecovery:false}; // 2+ days missed
  } else if (s.lastGoalDate===dayBefore && !s.inRecovery && s.current>0) {
    s={...s,inRecovery:true,baseStreak:s.current}; // enter recovery
  }
  let goalJustMet=false, recoveryJustDone=false;
  const MILESTONES=[3,7,14,30,100];
  let newMilestone=null;
  if (!s.inRecovery && todayCount===DAILY_GOAL && s.lastGoalDate!==today) {
    const consecutive=s.lastGoalDate===yesterday;
    const newCurrent=consecutive?s.current+1:1;
    s={...s,current:newCurrent,longest:Math.max(newCurrent,s.longest),lastGoalDate:today,inRecovery:false};
    goalJustMet=true;
    if (MILESTONES.includes(newCurrent)) newMilestone=newCurrent;
  } else if (s.inRecovery && todayCount===RECOVERY_GOAL && s.lastGoalDate!==today) {
    const newCurrent=s.baseStreak+1;
    s={...s,current:newCurrent,longest:Math.max(newCurrent,s.longest),lastGoalDate:today,inRecovery:false,recoveries:s.recoveries+1};
    recoveryJustDone=true;
    if (MILESTONES.includes(newCurrent)) newMilestone=newCurrent;
  }
  saveStreak(s);
  return {streakData:s,goalJustMet,recoveryJustDone,newMilestone};
}

function saveAchievements(a) { localStorage.setItem(ACHIEVE_KEY, JSON.stringify(a)); }
function computeAchieveValues(cards,history,streakData,sessionCards) {
  const totalReviewed=Object.values(history).reduce((s,d)=>s+(d.reviewed||0),0);
  const financeMastered=cards.filter(c=>FINANCE_FRONTS.has(c.front.toLowerCase())&&c.repetitions>=3).length;
  const stage2=cards.filter(c=>c.stage===2).length;
  const level=getLevelIdx(loadXP())+1;
  return {
    cards_reviewed: totalReviewed,
    streak: streakData.current,
    finance: financeMastered,
    session: sessionCards,
    created: cards.length,
    stage2,
    recovery: streakData.recoveries||0,
    level,
  };
}
// Returns array of newly unlocked tier indices per achievement id, e.g. {cards_reviewed:1}
function checkNewAchievements(values, prevAchievements) {
  const newUnlocks={};
  ACHIEVEMENTS_DEF.forEach(a=>{
    const val=values[a.id]||0;
    const prevTier=prevAchievements[a.id]||0;
    let newTier=prevTier;
    a.tiers.forEach((t,i)=>{ if(val>=t.goal && i+1>newTier) newTier=i+1; });
    if(newTier>prevTier) newUnlocks[a.id]=newTier;
  });
  return newUnlocks;
}
function totalAchievements(achievements) {
  return Object.values(achievements).reduce((s,v)=>s+v,0);
}
function maxAchievements() { return ACHIEVEMENTS_DEF.length*3; }

// Course countdown
function getCourseCountdown() {
  const now=new Date();
  const diff=COURSE_DATE-now;
  if(diff<=0) return {days:0,done:true,pct:100};
  const days=Math.ceil(diff/86400000);
  const firstStr=localStorage.getItem(FIRST_KEY);
  if(!firstStr) localStorage.setItem(FIRST_KEY, now.toISOString().slice(0,10));
  const first=new Date(localStorage.getItem(FIRST_KEY)||now.toISOString().slice(0,10));
  const total=COURSE_DATE-first;
  const elapsed=now-first;
  const pct=Math.min(100,Math.round(elapsed/total*100));
  return {days,done:false,pct};
}

// Smart sort: prioritize overdue 7+ days, then lowest easeFactor, then new cards
function smartSort(dueCards) {
  const now = Date.now();
  const SEVEN_DAYS = 7 * 24 * 60 * 60 * 1000;
  const g1 = [], g2 = [], g3 = [];
  for (const c of dueCards) {
    if (c.repetitions === 0) g3.push(c);
    else if (now - c.nextReview >= SEVEN_DAYS) g1.push(c);
    else g2.push(c);
  }
  g1.sort((a, b) => a.nextReview - b.nextReview);   // most overdue first
  g2.sort((a, b) => a.easeFactor - b.easeFactor);   // hardest first
  return [...g1, ...g2, ...g3];
}

// Audio pronunciation
function speak(text) {
  if(!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const utter=new SpeechSynthesisUtterance(text.split(' — ')[0].split(' — ')[0].split('—')[0].trim());
  utter.lang='en-US'; utter.rate=0.9;
  window.speechSynthesis.speak(utter);
}

function StudyView({ cards, setCards, direction, setDirection, onDone, studyDeck, studyMode, decks, savedSession }) {
  // ── Queue state ──────────────────────────────────────────────────────────────
  const [liveQueue,    setLiveQueue]    = useState(() => {
    if (savedSession) {
      // Restore from saved session; in-progress (seenIds) cards go first
      const cardMap = new Map(cards.map(c => [c.id, c]));
      const seenSet = new Set(savedSession.seenIds || []);
      const restored = (savedSession.queueIds || []).map(id => cardMap.get(id)).filter(Boolean);
      const inProgress = restored.filter(c => seenSet.has(c.id));
      const fresh = restored.filter(c => !seenSet.has(c.id));
      return [...inProgress, ...fresh];
    }
    if (studyMode === 'smart') return smartSort(cards.filter(isDue));
    return cards.filter(c => isDue(c) && (studyDeck == null || c.deck === studyDeck));
  });
  const [doneIds,      setDoneIds]      = useState(() =>
    savedSession ? new Set(savedSession.doneIds || []) : new Set()
  );
  const [seenIds,      setSeenIds]      = useState(() =>
    savedSession ? new Set(savedSession.seenIds || []) : new Set()
  );

  // ── UI state ─────────────────────────────────────────────────────────────────
  const [phase,        setPhase]        = useState('question');
  const [typed,        setTyped]        = useState('');
  const [correct,      setCorrect]      = useState(null);
  const [hintShown,    setHintShown]    = useState(false);
  const [graduated,    setGraduated]    = useState(false);
  const [sessionXP,    setSessionXP]    = useState(0);
  const [sessionCards, setSessionCards] = useState(0);
  const [levelUp,      setLevelUp]      = useState(null);
  const [streakToast,  setStreakToast]  = useState(null);
  const [feedbackMsg,  setFeedbackMsg]  = useState(null);
  const [newCardsMsg,  setNewCardsMsg]  = useState(null);
  const [showQuit,     setShowQuit]     = useState(false);
  const inputRef = useRef(null);
  const rateRef  = useRef(null); // always points to latest rate() closure

  // ── Derived values ───────────────────────────────────────────────────────────
  const card         = liveQueue[0];
  const effectiveDir = card ? getCardDirection(card, direction) : 'en-fi';
  const isFiEn       = effectiveDir === 'fi-en';
  const uniqueInLive = new Set(liveQueue.map(c => c.id)).size;
  const totalUnique  = doneIds.size + uniqueInLive;
  const progressPct  = totalUnique > 0 ? Math.round(doneIds.size / totalUnique * 100) : 0;
  const liveIds      = new Set(liveQueue.map(c => c.id));
  const unseenCount  = cards.filter(c =>
    (studyDeck == null || c.deck === studyDeck) &&
    !doneIds.has(c.id) && !liveIds.has(c.id)
  ).length;

  // ── Auto-inject helper (fires when queue < 20 total cards) ───────────────────
  function autoInject(queue, done) {
    if (queue.length >= 20) return { queue, added: 0 };
    const ids = new Set(queue.map(c => c.id));
    const eligible = cards.filter(c =>
      (studyDeck == null || c.deck === studyDeck) &&
      !done.has(c.id) && !ids.has(c.id)
    );
    if (eligible.length === 0) return { queue, added: 0 };
    const toAdd = eligible.slice(0, 5);
    return { queue: [...queue, ...toAdd], added: toAdd.length };
  }

  // ── Save current session to localStorage ─────────────────────────────────────
  function saveCurrentSession(queue, done, seen) {
    saveSavedSession({
      queueIds:  queue.map(c => c.id),
      doneIds:   [...done],
      seenIds:   [...seen],
      studyDeck,
      studyMode,
    });
  }

  // ── Effects ──────────────────────────────────────────────────────────────────
  useEffect(() => {
    if (card) setSeenIds(s => { const ns = new Set(s); ns.add(card.id); return ns; });
    setPhase('question'); setTyped(''); setCorrect(null); setHintShown(false);
  }, [card?.id, direction]);

  useEffect(() => {
    if (isFiEn && phase === 'question') inputRef.current?.focus();
  }, [card?.id, phase, isFiEn]);

  useEffect(() => {
    function onKey(e) {
      if (showQuit) return;
      const tag = document.activeElement?.tagName;
      const inInput = tag === 'BUTTON' || tag === 'INPUT' || tag === 'TEXTAREA';
      if (e.key === 'Enter' && !isFiEn && !inInput) {
        setPhase(p => p === 'question' ? 'answered' : 'question');
        return;
      }
      if (phase === 'answered') {
        if      (e.key === 'ArrowLeft')  { e.preventDefault(); rateRef.current(1); }
        else if (e.key === 'ArrowDown')  { e.preventDefault(); rateRef.current(2); }
        else if (e.key === 'ArrowRight') { e.preventDefault(); rateRef.current(4); }
      }
    }
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [isFiEn, phase, showQuit]);

  // ── Session complete (all cards rated Oikein) ────────────────────────────────
  if (liveQueue.length === 0) {
    clearSavedSession();
    return (
      <SessionSummaryView
        sessionCards={sessionCards}
        sessionXP={sessionXP}
        history={loadHistory()}
        streakData={loadStreak()}
        onDone={onDone}
      />
    );
  }

  if (!card) return null;

  const promptText   = isFiEn ? card.back  : card.front;
  const answerText   = isFiEn ? card.front : card.back;
  const parsedPrompt = parseBack(promptText);
  const parsedAnswer = parseBack(answerText);
  const cardStage    = card.stage || 1;

  // ── Rate card ────────────────────────────────────────────────────────────────
  function rate(quality) {
    const isCorrect = quality >= 4;
    recordStudy(isCorrect);
    dbRecordStudy(isCorrect);

    let updated = sm2(card, quality);
    updated = { ...updated, stage: cardStage };
    if (cardStage === 1 && updated.repetitions >= 3) {
      updated = { ...updated, stage: 2 };
      setGraduated(true);
      setTimeout(() => setGraduated(false), 4000);
    }
    const newCards = cards.map(c => c.id === updated.id ? updated : c);
    setCards(newCards); saveCards(newCards);
    dbSaveCard(updated);

    // XP
    const xpEarned = XP_BY_Q[quality] || 1;
    const prevXP = loadXP(), newXP = prevXP + xpEarned;
    const prevLvl = getLevelIdx(prevXP), newLvl = getLevelIdx(newXP);
    saveXP(newXP);
    if (newLvl > prevLvl) setLevelUp(LEVELS[newLvl].name);
    setSessionXP(x => x + xpEarned);
    setSessionCards(n => n + 1);

    // Streak
    const todayHistory = loadHistory();
    const todayCount = todayHistory[dateStr(0)]?.reviewed || 0;
    const { goalJustMet, recoveryJustDone, newMilestone } = updateStreak(todayCount);
    if (goalJustMet)      setStreakToast('🔥 Päivän tavoite saavutettu!');
    if (recoveryJustDone) setStreakToast('💪 Putki pelastettu!');
    if (newMilestone)     setStreakToast(`🔥 ${newMilestone} päivän putki!`);
    if (goalJustMet || recoveryJustDone || newMilestone) setTimeout(() => setStreakToast(null), 3500);

    // Achievements
    const achVals = computeAchieveValues(newCards, loadHistory(), loadStreak(), sessionCards + 1);
    const prevAch = loadAchievements();
    const newUnlocks = checkNewAchievements(achVals, prevAch);
    if (Object.keys(newUnlocks).length > 0) saveAchievements({ ...prevAch, ...newUnlocks });

    // Queue manipulation
    let newQueue;
    let newDone = doneIds;

    if (isCorrect) {
      newDone = new Set([...doneIds, card.id]);
      newQueue = liveQueue.slice(1);
      setDoneIds(newDone);
      setFeedbackMsg(null);
    } else {
      const offset = quality === 1
        ? Math.floor(Math.random() * 6) + 5    // Vaikea:    5–10 positions
        : Math.floor(Math.random() * 11) + 10; // Uudestaan: 10–20 positions
      const msg = quality === 1 ? '🔄 Tulee pian uudelleen' : '🔄 Tulee hetken kuluttua uudelleen';
      setFeedbackMsg(msg);
      setTimeout(() => setFeedbackMsg(null), 2500);
      const rest = liveQueue.slice(1);
      const insertAt = Math.min(offset, rest.length);
      newQueue = [...rest.slice(0, insertAt), card, ...rest.slice(insertAt)];
    }

    // Auto-inject new cards when queue drops below 20
    const { queue: injectedQueue, added } = autoInject(newQueue, newDone);
    if (added > 0) {
      setNewCardsMsg(`✨ ${added} uutta korttia lisätty`);
      setTimeout(() => setNewCardsMsg(null), 2500);
    }
    setLiveQueue(injectedQueue);
    setPhase('question'); setTyped(''); setCorrect(null); setHintShown(false);
  }

  rateRef.current = rate;

  function checkAnswer(e) {
    e.preventDefault();
    if (!typed.trim()) return;
    const userInput   = typed.trim().toLowerCase();
    const fullAnswer  = card.front.trim().toLowerCase();
    const shortAnswer = fullAnswer.split(' — ')[0].trim();
    setCorrect(userInput === fullAnswer || userInput === shortAnswer);
    setPhase('answered');
  }

  // ── Render ───────────────────────────────────────────────────────────────────
  return (
    <div className="max-w-3xl mx-auto px-4 py-8">

      {/* Save & quit dialog */}
      {showQuit && (
        <div className="fixed inset-0 bg-black/70 flex items-center justify-center z-50 px-4">
          <div className="bg-gray-800 border border-gray-700 rounded-2xl p-6 max-w-sm w-full text-center shadow-2xl">
            <p className="text-white font-semibold text-lg mb-2">Lopeta sessio?</p>
            <p className="text-gray-400 text-sm mb-6">
              Edistymisesi tallennetaan — voit jatkaa siitä mihin jäit ensi kerralla.<br />
              <span className="text-gray-500 mt-1 block">({uniqueInLive} korttia kesken)</span>
            </p>
            <div className="flex gap-3">
              <button onClick={() => setShowQuit(false)}
                className="flex-1 py-2.5 bg-gray-700 hover:bg-gray-600 text-white font-medium rounded-xl transition-colors">
                Jatka
              </button>
              <button onClick={() => { saveCurrentSession(liveQueue, doneIds, seenIds); onDone(); }}
                className="flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl transition-colors">
                💾 Tallenna ja lopeta
              </button>
            </div>
          </div>
        </div>
      )}

      {/* Toasts */}
      {graduated   && <div className="mb-4 bg-amber-500/15 border border-amber-400/40 rounded-xl px-4 py-3 text-center text-amber-300 font-medium animate-pulse">🎉 Sana siirtyy tuottovaiheeseen!</div>}
      {levelUp     && <div className="mb-4 bg-purple-500/15 border border-purple-400/40 rounded-xl px-4 py-3 text-center text-purple-300 font-medium">⬆️ Uusi taso: {levelUp}!</div>}
      {streakToast && <div className="mb-4 bg-amber-500/15 border border-amber-400/40 rounded-xl px-4 py-3 text-center text-amber-300 font-medium">{streakToast}</div>}
      {/* Floating toasts — fixed position so they never shift the card layout */}
      {feedbackMsg && (
        <div key={feedbackMsg} className="toast-float bg-gray-800 border border-gray-600 rounded-full px-5 py-2 text-gray-300 text-sm shadow-xl">
          {feedbackMsg}
        </div>
      )}
      {newCardsMsg && (
        <div key={newCardsMsg} className="toast-float bg-green-900 border border-green-600/50 rounded-full px-5 py-2 text-green-300 text-sm shadow-xl" style={{bottom:'7rem'}}>
          {newCardsMsg}
        </div>
      )}

      {/* Session title */}
      {(() => {
        if (studyMode === 'smart') return <div className="text-amber-400 font-semibold text-sm mb-3">🔀 Älykäs kertaus</div>;
        if (studyDeck && decks) {
          const d = decks.find(dk => dk.id === studyDeck);
          if (d) return <div className="font-semibold text-sm mb-3" style={{color: d.color}}>{d.name}</div>;
        }
        return null;
      })()}

      <div className="flex items-center justify-between mb-3">
        <div className="flex items-center gap-2 flex-wrap">
          <button onClick={() => setShowQuit(true)}
            className="text-gray-500 hover:text-gray-300 text-sm transition-colors">
            ← Lopeta sessio
          </button>
          <span className="text-gray-700">|</span>
          <span className="text-gray-400 text-xs">✓ {doneIds.size} / {totalUnique}</span>
          <span className={`text-xs px-2 py-0.5 rounded-full font-medium ${
            cardStage === 2 ? 'bg-purple-500/20 text-purple-300' : 'bg-blue-500/20 text-blue-300'
          }`}>
            {cardStage === 2 ? '✍️ Tuotto' : '🔍 Tunnistus'}
          </span>
          {decks && card && (() => {
            const d = decks.find(dk => dk.id === (card.deck || 'yleinen'));
            return d ? (
              <span className="text-xs px-2 py-0.5 rounded-full font-medium"
                style={{backgroundColor: d.color + '33', color: d.color}}>
                {d.name}
              </span>
            ) : null;
          })()}
        </div>
        <DirectionToggle direction={direction} setDirection={setDirection} />
      </div>

      {/* Queue status */}
      <div className="text-gray-600 text-xs mb-3">
        🔄 {uniqueInLive} kesken · 📚 {unseenCount} uutta
      </div>

      {/* Progress bar */}
      <div className="w-full bg-gray-800 rounded-full h-1.5 mb-8">
        <div className="bg-amber-500 h-1.5 rounded-full transition-all"
          style={{ width: `${progressPct}%` }} />
      </div>

      {isFiEn ? (
        <>
          <div className="bg-gray-800 rounded-2xl p-8 mb-6 border border-gray-700 min-h-[150px] flex flex-col items-center justify-center gap-3">
            <p className="text-xl text-amber-200 text-center leading-relaxed">{parsedPrompt.main}</p>
            <button onClick={() => speak(answerText)} className="text-gray-500 hover:text-amber-400 text-xl transition-colors" title="Kuuntele">🔊</button>
            {parsedPrompt.hint && (hintShown
              ? <p className="text-gray-400 text-sm text-center italic">{parsedPrompt.hint}</p>
              : <button onClick={() => setHintShown(true)}
                  className="text-gray-500 text-xs border border-gray-700 hover:border-amber-500/50 hover:text-amber-400 rounded-lg px-3 py-1.5 transition-colors">
                  💡 Näytä vinkki
                </button>
            )}
          </div>
          {phase === 'question' ? (
            <form onSubmit={checkAnswer} className="space-y-3">
              <input ref={inputRef} value={typed} onChange={e => setTyped(e.target.value)}
                className="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-white text-lg focus:outline-none focus:border-amber-500 transition-colors"
                placeholder="Kirjoita englanninkielinen vastaus…" autoComplete="off" spellCheck="false" />
              <button type="submit" disabled={!typed.trim()}
                className="w-full py-3 bg-amber-500 hover:bg-amber-400 disabled:bg-gray-700 disabled:text-gray-500 text-gray-900 font-bold rounded-xl transition-colors">
                Tarkista
              </button>
            </form>
          ) : (
            <div className="space-y-4">
              {correct ? (
                <div className="bg-green-500/10 border border-green-500/40 rounded-xl px-5 py-4 text-green-400 text-center">
                  <span className="font-semibold text-green-300">✓ Oikein!</span>
                  <span className="ml-2">„{typed}"</span>
                </div>
              ) : (
                <div className="space-y-2">
                  <div className="bg-red-500/10 border border-red-500/40 rounded-xl px-5 py-4 text-red-400 text-center">
                    <span className="font-semibold text-red-300">✗ Väärin</span>
                    <span className="ml-2">— kirjoitit: „{typed}"</span>
                  </div>
                  <div className="bg-gray-800 border border-gray-700 rounded-xl px-5 py-3 text-center">
                    <span className="text-gray-400 text-sm">Oikea vastaus: </span>
                    <span className="text-white font-semibold">{answerText}</span>
                  </div>
                </div>
              )}
              {card.example && (
                <p className="text-gray-500 text-xs italic mt-2 text-center">„{card.example}"</p>
              )}
              <RatingButtons onRate={rate} />
            </div>
          )}
        </>
      ) : (
        <>
          <div className="flip-card w-full mb-8" style={{ minHeight: 200 }}>
            <div className={`flip-inner w-full h-full relative ${phase === 'answered' ? 'flipped' : ''}`} style={{ minHeight: 200 }}>
              <div className="flip-front absolute inset-0 bg-gray-800 rounded-2xl flex flex-col items-center justify-center p-8 cursor-pointer border border-gray-700 hover:border-amber-500/50 transition-colors"
                onClick={() => setPhase('answered')}>
                <p className="text-2xl font-semibold text-white text-center">{parsedPrompt.main}</p>
                <button onClick={e => { e.stopPropagation(); speak(promptText); }} className="text-gray-500 hover:text-amber-400 text-xl transition-colors mt-2" title="Kuuntele">🔊</button>
                {phase === 'question' && <p className="text-gray-500 text-sm mt-4">Klikkaa tai paina Enter kääntääksesi</p>}
              </div>
              <div className="flip-back absolute inset-0 bg-gray-800 rounded-2xl flex flex-col items-center justify-center gap-3 p-8 border border-amber-500/30 cursor-pointer hover:border-amber-400/50 transition-colors"
                onClick={() => setPhase('question')} title="Klikkaa tai paina Enter kääntääksesi takaisin">
                <p className="text-xl text-amber-200 text-center leading-relaxed">{parsedAnswer.main}</p>
                {parsedAnswer.hint && (hintShown
                  ? <p className="text-gray-400 text-sm text-center italic">{parsedAnswer.hint}</p>
                  : <button onClick={e => { e.stopPropagation(); setHintShown(true); }}
                      className="text-gray-500 text-xs border border-gray-700 hover:border-amber-500/50 hover:text-amber-400 rounded-lg px-3 py-1.5 transition-colors">
                      💡 Näytä vinkki
                    </button>
                )}
                {card.example && phase === 'answered' && (
                  <p className="text-gray-500 text-xs italic mt-2 text-center">„{card.example}"</p>
                )}
                <p className="text-gray-600 text-xs mt-1">↩ klikkaa tai Enter palataksesi</p>
              </div>
            </div>
          </div>
          {phase === 'question' ? (
            <button onClick={() => setPhase('answered')}
              className="w-full py-3 bg-gray-700 hover:bg-gray-600 text-white rounded-xl transition-colors flex items-center justify-center gap-2">
              Näytä vastaus
              <span className="text-gray-500 text-xs border border-gray-600 rounded px-1.5 py-0.5">Enter</span>
            </button>
          ) : (
            <RatingButtons onRate={rate} />
          )}
        </>
      )}
    </div>
  );
}

// ── Add / Edit ────────────────────────────────────────────────────────────────

function AddCardView({ cards, setCards, editCard, setEditCard, decks }) {
  const [front,   setFront]   = useState(editCard ? editCard.front   : '');
  const [back,    setBack]    = useState(editCard ? editCard.back    : '');
  const [example, setExample] = useState(editCard?.example || '');
  const [deck,    setDeck]    = useState(editCard?.deck || loadLastDeck());
  const [saved,   setSaved]   = useState(false);

  function handleSubmit(e) {
    e.preventDefault();
    if (!front.trim() || !back.trim()) return;
    let updated, cardToSync;
    if (editCard) {
      const edited = { ...editCard, front: front.trim(), back: back.trim(), example: example.trim() || null, deck };
      updated = cards.map(c => c.id === editCard.id ? edited : c);
      cardToSync = edited;
      setEditCard(null);
    } else {
      const card = newCard(front.trim(), back.trim(), example.trim() || null, deck);
      updated = [...cards, card];
      cardToSync = card;
    }
    setCards(updated); saveCards(updated);
    dbSaveCard(cardToSync);
    setFront(''); setBack(''); setExample('');
    setSaved(true); setTimeout(() => setSaved(false), 2000);
  }

  return (
    <div className="max-w-3xl mx-auto px-4 py-8">
      <h2 className="text-xl font-bold text-amber-400 mb-6">
        {editCard ? 'Muokkaa korttia' : 'Lisää kortti'}
      </h2>
      <form onSubmit={handleSubmit} className="space-y-4">
        <div>
          <label className="block text-gray-400 text-sm mb-1">Etupuoli</label>
          <input value={front} onChange={e => setFront(e.target.value)}
            className="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-amber-500"
            placeholder="Sana tai kysymys" />
        </div>
        <div>
          <label className="block text-gray-400 text-sm mb-1">Takapuoli</label>
          <textarea value={back} onChange={e => setBack(e.target.value)} rows={3}
            className="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-amber-500 resize-none"
            placeholder="Vastaus tai käännös" />
        </div>
        <div>
          <label className="block text-gray-400 text-sm mb-1">Esimerkkilause <span className="text-gray-600">(valinnainen)</span></label>
          <input value={example} onChange={e => setExample(e.target.value)}
            className="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-amber-500"
            placeholder="Esim. She sold her portfolio before the crash." />
        </div>
        <div>
          <label className="block text-gray-400 text-sm mb-1">Pakka</label>
          <select value={deck} onChange={e=>{setDeck(e.target.value);saveLastDeck(e.target.value);}}
            className="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-amber-500">
            {decks.map(d=><option key={d.id} value={d.id}>{d.name}</option>)}
          </select>
        </div>
        <div className="flex gap-3">
          <button type="submit"
            className="flex-1 py-3 bg-amber-500 hover:bg-amber-400 text-gray-900 font-bold rounded-xl transition-colors">
            {editCard ? 'Tallenna muutokset' : 'Lisää kortti'}
          </button>
          {editCard && (
            <button type="button" onClick={() => setEditCard(null)}
              className="px-6 py-3 bg-gray-700 hover:bg-gray-600 text-white rounded-xl transition-colors">
              Peruuta
            </button>
          )}
        </div>
        {saved && <div className="text-green-400 text-sm text-center">Kortti tallennettu!</div>}
      </form>
    </div>
  );
}

// ── Import ────────────────────────────────────────────────────────────────────

function ImportView({ cards, setCards, decks }) {
  const [text,  setText]  = useState('');
  const [msg,   setMsg]   = useState('');
  const [error, setError] = useState('');

  function handleImport() {
    setMsg(''); setError('');
    try {
      const parsed = JSON.parse(text.trim());
      if (!Array.isArray(parsed)) throw new Error('Pitää olla JSON-taulukko');
      const existing = new Set(cards.map(c => c.front.toLowerCase()));
      const toAdd = parsed
        .filter(item => item.front && item.back && !existing.has(item.front.toLowerCase()))
        .map(item => {
          const deckId = item.deck && decks.find(d=>d.id===item.deck||d.name.includes(item.deck)) ?
            (decks.find(d=>d.id===item.deck)||decks.find(d=>d.name.includes(item.deck))||{id:'yleinen'}).id : 'yleinen';
          return newCard(String(item.front).trim(), String(item.back).trim(), item.example||null, deckId);
        });
      if (toAdd.length === 0) { setMsg('Ei uusia kortteja tuotavaksi (kaikki jo olemassa).'); return; }
      const updated = [...cards, ...toAdd];
      setCards(updated); saveCards(updated);
      toAdd.forEach(c => dbSaveCard(c));
      setText('');
      setMsg(`Tuotiin ${toAdd.length} uutta korttia`);
    } catch (e) { setError('Virheellinen JSON: ' + e.message); }
  }

  return (
    <div className="max-w-3xl mx-auto px-4 py-8">
      <h2 className="text-xl font-bold text-amber-400 mb-2">Tuo kortit</h2>
      <p className="text-gray-400 text-sm mb-6">
        Liitä JSON-taulukko muodossa:{' '}
        <code className="text-amber-300">[{"{"}"front":"...", "back":"..."{"}"}]</code>
      </p>
      <textarea value={text} onChange={e => setText(e.target.value)} rows={10}
        className="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-amber-500 resize-none font-mono text-sm mb-4"
        placeholder={'[\n  {"front": "hello", "back": "hei"},\n  {"front": "world", "back": "maailma"}\n]'} />
      <button onClick={handleImport} disabled={!text.trim()}
        className="w-full py-3 bg-amber-500 hover:bg-amber-400 disabled:bg-gray-700 disabled:text-gray-500 text-gray-900 font-bold rounded-xl transition-colors">
        Tuo kortit
      </button>

}

function DecksView({ cards, decks, setDecks }) {
  const [newName, setNewName] = useState('');
  const [editId,  setEditId]  = useState(null);
  const [editName,setEditName]= useState('');

  function createDeck() {
    const name = newName.trim();
    if (!name) return;
    const id = name.toLowerCase().replace(/[^a-z0-9]/g,'_') + '_' + Date.now();
    const colors = ['#F59E0B','#3B82F6','#10B981','#8B5CF6','#EF4444','#EC4899','#14B8A6'];
    const color = colors[decks.length % colors.length];
    const updated = [...decks, { id, name, color }];
    setDecks(updated); saveDecks(updated);
    setNewName('');
  }

  function renameDeck(id) {
    const name = editName.trim();
    if (!name) return;
    const updated = decks.map(d => d.id===id ? {...d, name} : d);
    setDecks(updated); saveDecks(updated);
    setEditId(null); setEditName('');
  }

  function deleteDeck(id) {
    const deck = decks.find(d=>d.id===id);
    if (!deck) return;
    const cardCount = cards.filter(c=>c.deck===id).length;
    const msg = cardCount > 0
      ? `Haluatko varmasti poistaa pakan "${deck.name}" ja kaikki sen ${cardCount} korttia?`
      : `Haluatko varmasti poistaa pakan "${deck.name}"?`;
    if (!confirm(msg)) return;
    const updated = decks.filter(d=>d.id!==id);
    setDecks(updated); saveDecks(updated);
  }

  return (
    <div className="max-w-3xl mx-auto px-4 py-8">
      <h2 className="text-xl font-bold text-amber-400 mb-6">Sanapakat</h2>
      <div className="space-y-3 mb-6">
        {decks.map(deck => {
          const deckCards = cards.filter(c=>c.deck===deck.id);
          const mastered  = deckCards.filter(c=>c.repetitions>=3).length;
          const due       = deckCards.filter(isDue).length;
          const isDefault = deck.id==='yleinen';
          return (
            <div key={deck.id} className="bg-gray-800 rounded-xl p-4 border border-gray-700">
              {editId===deck.id ? (
                <div className="flex gap-2">
                  <input value={editName} onChange={e=>setEditName(e.target.value)}
                    className="flex-1 bg-gray-700 border border-gray-600 rounded-lg px-3 py-1.5 text-white text-sm focus:outline-none focus:border-amber-500"
                    onKeyDown={e=>{if(e.key==='Enter')renameDeck(deck.id);if(e.key==='Escape')setEditId(null);}}
                    autoFocus />
                  <button onClick={()=>renameDeck(deck.id)} className="px-3 py-1.5 bg-amber-500 text-gray-900 font-medium rounded-lg text-sm">Tallenna</button>
                  <button onClick={()=>setEditId(null)} className="px-3 py-1.5 bg-gray-700 text-gray-400 rounded-lg text-sm">Peruuta</button>
                </div>
              ) : (
                <div className="flex items-center gap-3">
                  <div className="w-3 h-3 rounded-full shrink-0" style={{backgroundColor:deck.color}} />
                  <div className="flex-1 min-w-0">
                    <div className="flex items-center gap-2">
                      <span className="text-white font-medium">{deck.name}</span>
                      {due>0 && <span className="text-xs bg-amber-500/20 text-amber-400 px-1.5 py-0.5 rounded-full">{due} erääntynyt</span>}
                    </div>
                    <div className="text-gray-500 text-xs mt-0.5">{deckCards.length} korttia · {mastered} hallittu</div>
                  </div>
                  <button onClick={()=>{setEditId(deck.id);setEditName(deck.name);}}
                    className="text-gray-500 hover:text-amber-400 transition-colors p-1" title="Nimeä uudelleen">✏️</button>
                  {!isDefault && (
                    <button onClick={()=>deleteDeck(deck.id)}
                      className="text-gray-500 hover:text-red-400 transition-colors p-1" title="Poista">🗑️</button>
                  )}
                </div>
              )}
            </div>
          );
        })}
      </div>
      <div className="bg-gray-800 rounded-xl p-4 border border-gray-700">
        <p className="text-gray-400 text-sm font-medium mb-3">Luo uusi pakka</p>
        <div className="flex gap-2">
          <input value={newName} onChange={e=>setNewName(e.target.value)}
            className="flex-1 bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-amber-500"
            placeholder="Pakan nimi, esim. 🏢 Työsanasto"
            onKeyDown={e=>e.key==='Enter'&&createDeck()} />
          <button onClick={createDeck} disabled={!newName.trim()}
            className="px-4 py-2 bg-amber-500 hover:bg-amber-400 disabled:bg-gray-600 text-gray-900 font-medium rounded-lg text-sm transition-colors">
            Luo
          </button>
        </div>
      </div>
    </div>
  );
}

              <span className={`text-xs font-medium ${cls} shrink-0`}>{label}</span>
              <select value={card.deck||'yleinen'}
                onChange={e=>{
                  const updated=cards.map(c=>c.id===card.id?{...c,deck:e.target.value}:c);

    </div>
  );

// ── Heatmap ───────────────────────────────────────────────────────────────────

function Heatmap({ history }) {
  const days = [];
  const today = new Date();
  for (let i = 29; i >= 0; i--) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    const key  = d.toISOString().slice(0, 10);
    const data = history[key] || { reviewed: 0, correct: 0 };
    days.push({ key, day: d.getDate(), month: d.getMonth() + 1, ...data });
  }
  function cellColor(n) {
    if (n === 0) return 'bg-gray-700/60 border border-gray-700';
    if (n < 5)   return 'bg-amber-900/80';
    if (n < 15)  return 'bg-amber-600';
    return 'bg-amber-400';
  }
  return (
    <div>
      <div className="grid gap-1.5" style={{ gridTemplateColumns: 'repeat(10, 1fr)' }}>
        {days.map(d => (
          <div key={d.key} className={`${cellColor(d.reviewed)} rounded aspect-square`}
            title={`${d.day}.${d.month}.: ${d.reviewed} korttia${d.reviewed > 0 ? ` · ${Math.round(d.correct / d.reviewed * 100)}% oikein` : ''}`} />
        ))}
      </div>
      <div className="flex items-center gap-1.5 mt-3 text-xs text-gray-600">
        <span>Vähemmän</span>
        {['bg-gray-700/60 border border-gray-700','bg-amber-900/80','bg-amber-600','bg-amber-400'].map((c,i) => (
          <div key={i} className={`w-3 h-3 rounded ${c}`} />
        ))}
        <span>Enemmän</span>
      </div>
    </div>
  );
}

// ── Grammar ───────────────────────────────────────────────────────────────────

function DrillSession({ drillType, onRestart }) {
  const [exercises]               = useState(() => shuffle(GRAMMAR_DRILLS[drillType]));
  const [idx,    setIdx]          = useState(0);
  const [phase,  setPhase]        = useState('question');
  const [score,  setScore]        = useState({ correct: 0, total: 0 });
  const [done,   setDone]         = useState(false);
  const [ps,     setPs]           = useState('');
  const [pp,     setPp]           = useState('');
  const [inp,    setInp]          = useState('');
  const [result, setResult]       = useState(null);
  const nextRef  = useRef(null);
  const firstRef = useRef(null);

  const ex = exercises[idx];

  useEffect(() => {
    if (phase === 'question') firstRef.current?.focus();
    else nextRef.current?.focus();
  }, [idx, phase]);

  function advance() {
    if (idx + 1 >= exercises.length) { setDone(true); return; }
    setIdx(i => i + 1); setPhase('question');
    setPs(''); setPp(''); setInp(''); setResult(null);
  }
  function submit(correct, extra = {}) {
    setResult({ correct, ...extra });
    setScore(s => ({ correct: s.correct + (correct ? 1 : 0), total: s.total + 1 }));
    setPhase('answered');
  }
  const checkVerb = e => { e.preventDefault();
    const psOk = ps.trim().toLowerCase() === ex.pastSimple.toLowerCase();
    const ppOk = pp.trim().toLowerCase() === ex.pastParticiple.toLowerCase();
    submit(psOk && ppOk, { psOk, ppOk }); };
  const checkPrep = e => { e.preventDefault();
    submit(inp.trim().toLowerCase() === ex.answer.toLowerCase()); };
  const pickAgreement = opt =>
    submit(opt.toLowerCase() === ex.answer.toLowerCase(), { selected: opt });

  function SentenceBlank({ fill, fillClass }) {
    const parts = ex.sentence.split('___');
    return (
      <p className="text-xl text-white leading-relaxed text-center">
        {parts[0]}
        {fill
          ? <span className={`font-bold mx-1 ${fillClass}`}>{fill}</span>
          : <span className="inline-block border-b-2 border-amber-500 w-14 mx-1 align-bottom" />}
        {parts[1]}
      </p>
    );
  }

  if (done) {
    const pct = Math.round(score.correct / exercises.length * 100);
    return (
      <div className="text-center py-10">
        <div className="text-5xl mb-4">{pct === 100 ? '🎉' : pct >= 70 ? '👍' : '📝'}</div>
        <h3 className="text-2xl font-bold text-amber-400 mb-1">{score.correct} / {exercises.length} oikein</h3>
        <p className="text-gray-400 mb-8">{pct}% oikein</p>
        <button onClick={onRestart} className="px-8 py-3 bg-amber-500 hover:bg-amber-400 text-gray-900 font-bold rounded-xl transition-colors">
          Aloita uudelleen
        </button>
      </div>
    );
  }

  const Question = () => {
    if (drillType === 'verbs') return (
      <form onSubmit={checkVerb} className="space-y-4">
        <div className="bg-gray-800 rounded-2xl p-8 border border-gray-700 text-center">
          <p className="text-gray-500 text-xs uppercase tracking-wider mb-2">Infinitive</p>
          <p className="text-4xl font-bold text-white">{ex.infinitive}</p>
        </div>
        <div className="grid grid-cols-2 gap-3">
          {[
            { label: 'Past Simple',     val: ps, set: setPs, ref: firstRef, ph: 'e.g. went' },
            { label: 'Past Participle', val: pp, set: setPp, ref: null,     ph: 'e.g. gone' },
          ].map(({ label, val, set, ref, ph }) => (
            <div key={label}>
              <label className="text-gray-400 text-xs mb-1.5 block">{label}</label>
              <input ref={ref} value={val} onChange={e => set(e.target.value)}
                className="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-amber-500"
                placeholder={ph} autoComplete="off" spellCheck="false" />
            </div>
          ))}
        </div>
        <button type="submit" disabled={!ps.trim() || !pp.trim()}
          className="w-full py-3 bg-amber-500 hover:bg-amber-400 disabled:bg-gray-700 disabled:text-gray-500 text-gray-900 font-bold rounded-xl transition-colors">
          Tarkista
        </button>
      </form>
    );
    if (drillType === 'prepositions') return (
      <form onSubmit={checkPrep} className="space-y-4">
        <div className="bg-gray-800 rounded-2xl p-8 border border-gray-700">
          <p className="text-gray-500 text-xs uppercase tracking-wider mb-4 text-center">Täydennä prepositio</p>
          <SentenceBlank />
        </div>
        <input ref={firstRef} value={inp} onChange={e => setInp(e.target.value)}
          className="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-white text-lg focus:outline-none focus:border-amber-500"
          placeholder="Kirjoita prepositio…" autoComplete="off" spellCheck="false" />
        <button type="submit" disabled={!inp.trim()}
          className="w-full py-3 bg-amber-500 hover:bg-amber-400 disabled:bg-gray-700 disabled:text-gray-500 text-gray-900 font-bold rounded-xl transition-colors">
          Tarkista
        </button>
      </form>
    );
    return (
      <div className="space-y-6">
        <div className="bg-gray-800 rounded-2xl p-8 border border-gray-700">
          <p className="text-gray-500 text-xs uppercase tracking-wider mb-4 text-center">Valitse oikea muoto</p>
          <SentenceBlank />
        </div>
        <div className="grid grid-cols-2 gap-4">
          {ex.options.map((opt, i) => (
            <button key={opt} ref={i === 0 ? firstRef : null} onClick={() => pickAgreement(opt)}
              className="py-5 bg-gray-700 hover:bg-gray-600 text-white text-xl font-semibold rounded-xl transition-colors">
              {opt}
            </button>
          ))}
        </div>
      </div>
    );
  };

  const Answered = () => {
    const ok = result?.correct;
    const banner = (
      <div className={`rounded-xl px-5 py-3 border text-center font-semibold ${ok ? 'bg-green-500/10 border-green-500/30 text-green-300' : 'bg-red-500/10 border-red-500/30 text-red-300'}`}>
        {ok ? '✓ Oikein!' : '✗ Väärin'}
      </div>
    );
    const nextBtn = (
      <button ref={nextRef} onClick={advance}
        className="w-full py-3 bg-gray-700 hover:bg-gray-600 text-white font-semibold rounded-xl transition-colors">
        {idx + 1 < exercises.length ? 'Seuraava →' : 'Näytä tulos'}
      </button>
    );
    if (drillType === 'verbs') return (
      <div className="space-y-3">
        <div className="bg-gray-800 rounded-2xl p-6 border border-gray-700 text-center">
          <p className="text-gray-500 text-xs uppercase tracking-wider mb-1">Infinitive</p>
          <p className="text-3xl font-bold text-white">{ex.infinitive}</p>
        </div>
        {banner}
        <div className="grid grid-cols-2 gap-3">
          {[
            { label: 'Past Simple',     yours: ps, ans: ex.pastSimple,     ok: result.psOk },
            { label: 'Past Participle', yours: pp, ans: ex.pastParticiple, ok: result.ppOk },
          ].map(({ label, yours, ans, ok }) => (
            <div key={label} className={`rounded-xl p-4 border ${ok ? 'border-green-500/30 bg-green-500/5' : 'border-red-500/30 bg-red-500/5'}`}>
              <p className="text-gray-500 text-xs mb-1">{label}</p>
              <p className={`font-semibold ${ok ? 'text-green-400' : 'text-red-400'}`}>{yours || '—'}</p>
              {!ok && <p className="text-white text-sm mt-1">→ <span className="font-bold">{ans}</span></p>}
            </div>
          ))}
        </div>
        {nextBtn}
      </div>
    );
    if (drillType === 'prepositions') return (
      <div className="space-y-3">
        <div className="bg-gray-800 rounded-2xl p-8 border border-gray-700">
          <SentenceBlank fill={inp || '—'} fillClass={ok ? 'text-green-400' : 'text-red-400'} />
          {!ok && <p className="text-gray-400 text-sm mt-3 text-center">Oikea: <span className="text-white font-bold">{ex.answer}</span></p>}
        </div>
        {banner}{nextBtn}
      </div>
    );
    return (
      <div className="space-y-3">
        <div className="bg-gray-800 rounded-2xl p-8 border border-gray-700">
          <SentenceBlank fill={result.selected} fillClass={ok ? 'text-green-400' : 'text-red-400'} />
          {!ok && <p className="text-gray-400 text-sm mt-3 text-center">Oikea: <span className="text-white font-bold">{ex.answer}</span></p>}
        </div>
        {banner}{nextBtn}
      </div>
    );
  };

  return (
    <div>
      <div className="flex items-center justify-between mb-3">
        <span className="text-gray-400 text-sm">Tehtävä {idx + 1} / {exercises.length}</span>
        <span className="text-amber-400 text-sm font-medium">{score.correct} oikein</span>
      </div>
      <div className="w-full bg-gray-800 rounded-full h-1.5 mb-8">
        <div className="bg-amber-500 h-1.5 rounded-full transition-all" style={{ width: `${(idx / exercises.length) * 100}%` }} />
      </div>
      {phase === 'question' ? <Question /> : <Answered />}
    </div>
  );
}

function GrammarView() {
  const [drillType,   setDrillType]   = useState('verbs');
  const [sessionKey,  setSessionKey]  = useState(0);
  const TABS = [
    { id: 'verbs',        label: 'Epäsäännölliset verbit', desc: 'Past simple & participle' },
    { id: 'prepositions', label: 'Prepositiot',             desc: 'Täydennä prepositio' },
    { id: 'agreement',    label: 'Kongruenssi',             desc: 'Valitse verbin muoto' },
  ];
  return (
    <div className="max-w-3xl mx-auto px-4 py-8">
      <h2 className="text-xl font-bold text-amber-400 mb-6">Kielioppi</h2>
      <div className="grid grid-cols-3 gap-2 mb-8">
        {TABS.map(t => (
          <button key={t.id} onClick={() => { setDrillType(t.id); setSessionKey(k => k + 1); }}
            className={`py-3 px-2 rounded-xl text-sm font-medium transition-colors border ${
              drillType === t.id
                ? 'bg-amber-500 text-gray-900 border-amber-500'
                : 'bg-gray-800 text-gray-400 border-gray-700 hover:border-amber-500/40 hover:text-white'
            }`}>
            <div className="font-semibold">{t.label}</div>
            <div className={`text-xs mt-0.5 ${drillType === t.id ? 'text-amber-900' : 'text-gray-600'}`}>{t.desc}</div>
          </button>
        ))}
      </div>
      <DrillSession key={`${drillType}-${sessionKey}`} drillType={drillType} onRestart={() => setSessionKey(k => k + 1)} />
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────────────────────

function App() {
  const [authState,  setAuthState]  = useState('loading'); // 'loading' | 'anon' | 'auth'
  const [cards,      setCards]      = useState([]);
  const [syncing,    setSyncing]    = useState(false);
  const [syncError,  setSyncError]  = useState(null);
  const [view,       setView]       = useState('home');
  const [editCard,   setEditCard]   = useState(null);
  const [direction,  setDirection]  = useState(loadDirection);
  const [decks,      setDecks]      = useState(() => {
    const stored = loadDecks();
    if (!localStorage.getItem(DECKS_KEY)) { saveDecks(DEFAULT_DECKS); return DEFAULT_DECKS; }
    return stored;
  });
  const [studyDeck,     setStudyDeck]     = useState(null);
  const [studyMode,     setStudyMode]     = useState('deck'); // 'deck' | 'smart'
  const [savedSession,  setSavedSession]  = useState(loadSavedSession);

  useEffect(() => {
    // Timeout: if auth hangs for 8 s, fall through to anon (shows login screen)
    const authTimeout = setTimeout(() => setAuthState('anon'), 8000);

    sb.auth.getSession()
      .then(({ data: { session } }) => {
        clearTimeout(authTimeout);
        _session = session;
        if (session) { setAuthState('auth'); syncFromSupabase(); }
        else          { setAuthState('anon'); }
      })
      .catch(() => { clearTimeout(authTimeout); setAuthState('anon'); });

    const { data: { subscription } } = sb.auth.onAuthStateChange((event, session) => {
      _session = session;
      if (session) {
        setAuthState('auth');
        if (event === 'SIGNED_IN') syncFromSupabase();
      } else {
        setAuthState('anon');
        setCards([]);
      }
    });
    return () => { clearTimeout(authTimeout); subscription.unsubscribe(); };
  }, []);

  async function syncFromSupabase() {
    setSyncing(true);
    setSyncError(null);
    try {
      // Verify session first
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { setSyncError('Ei istuntoa — kirjaudu uudelleen sisään'); return; }
      _session = session;

      const { cards: dbCards, errorMsg } = await dbLoadCards();
      if (dbCards === null) {
        // Network error — fall back to localStorage
        const local = loadCards();
        const fallback = local || PRELOADED.map(p => newCard(p.front, p.back, p.example, p.deck||'yleinen'));
        setCards(fallback); saveCards(fallback);
        setSyncError('DB-virhe: ' + errorMsg);
        return;
      }
      if (dbCards.length === 0) {
        // First login — migrate any existing localStorage cards (including deck/stage/example)
        const local = loadCards();
        const toUpload = (local && local.length > 0)
          ? local
          : PRELOADED.map(p => newCard(p.front, p.back, p.example, p.deck||'yleinen'));
        await Promise.all(toUpload.map(c => dbSaveCard(c)));
        setCards(toUpload); saveCards(toUpload);
      } else {
        // DB is the source of truth — deck, stage, example all come from DB now
        setCards(dbCards); saveCards(dbCards);
      }
    } catch(e) {
      setSyncError('Virhe: ' + e.message);
    } finally {
      setSyncing(false);
    }
  }

  function handleStudyDeck(deckId) {
    clearSavedSession(); setSavedSession(null);
    setStudyDeck(deckId); setStudyMode('deck'); setView('study');
  }

  function handleSmartStudy() {
    clearSavedSession(); setSavedSession(null);
    setStudyDeck(null); setStudyMode('smart'); setView('study');
  }

  function handleResume() {
    if (savedSession) {
      setStudyDeck(savedSession.studyDeck || null);
      setStudyMode(savedSession.studyMode || 'deck');
    }
    setView('study');
  }

  function handleDismissSession() {
    clearSavedSession(); setSavedSession(null);
  }

  function handleStudyDone() {
    setStudyDeck(null); setStudyMode('deck');
    setSavedSession(loadSavedSession()); // reload — may have been saved on quit
    setView('home');
  }

  const dueCount = cards.filter(isDue).length;

  if (authState === 'loading') return (
    <div className="min-h-screen bg-gray-900 flex items-center justify-center">
      <div className="text-center">
        <div className="text-4xl font-bold text-amber-400 mb-3">Flashcards</div>
        <div className="text-gray-500 text-sm animate-pulse">Ladataan…</div>
      </div>
    </div>
  );

  if (authState === 'anon') return <AuthView />;

  return (
    <div className="min-h-screen bg-gray-900 text-white">
      <NavBar view={view} setView={setView} dueCount={dueCount}
        email={_session?.user?.email} syncing={syncing} onSync={syncFromSupabase} />
      {syncing && (
        <div className="bg-amber-500/10 border-b border-amber-500/20 text-amber-400/80 text-xs text-center py-1.5">
          Synkronoidaan pilven kanssa…
        </div>
      )}
      {syncError && (
        <div className="bg-red-900/40 border-b border-red-500/30 text-red-400 text-xs text-center py-2 flex items-center justify-center gap-3">
          ⚠️ {syncError}
          <button onClick={() => { setSyncError(null); syncFromSupabase(); }}
            className="underline text-red-300 hover:text-red-200">Yritä uudelleen</button>
        </div>
      )}
      <main>
        {view === 'home'    && <HomeView cards={cards} setView={setView} direction={direction} setDirection={setDirection} decks={decks} onStudyDeck={handleStudyDeck} onSmartStudy={handleSmartStudy} savedSession={savedSession} onResume={handleResume} onDismissSession={handleDismissSession} />}
        {view === 'study'   && <StudyView cards={cards} setCards={setCards} direction={direction} setDirection={setDirection} onDone={handleStudyDone} studyDeck={studyDeck} studyMode={studyMode} decks={decks} savedSession={savedSession} />}
        {view === 'add'     && <AddCardView cards={cards} setCards={setCards} editCard={editCard} setEditCard={setEditCard} decks={decks} />}
        {view === 'import'  && <ImportView cards={cards} setCards={setCards} decks={decks} />}
        {view === 'manage'  && <ManageView cards={cards} setCards={setCards} setEditCard={setEditCard} setView={setView} decks={decks} />}
        {view === 'decks'   && <DecksView cards={cards} decks={decks} setDecks={setDecks} />}
        {view === 'stats'   && <StatsView cards={cards} decks={decks} />}
        {view === 'grammar' && <GrammarView />}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
